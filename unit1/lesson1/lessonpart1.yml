title: Page
content: >
  In this lesson, we'll learn about different ways to sort lists in Python.
  Sorting means putting things in order, like arranging numbers from smallest to
  largest. It's important because it helps us organize data so we can find
  things quickly.


  To make sorting fun, let's try an activity without computers! Imagine you're
  sorting yourselves by height or birth month. This is like a sorting algorithm
  called Bubble Sort. You compare with the person next to you and swap places if
  needed, until everyone is in order. This helps you see how sorting works in
  real life!


  ### 1. Bubble Sort


  Bubble Sort is a simple way to sort. You go through the list, compare two
  items, and swap them if they're in the wrong order. You keep doing this until
  everything is sorted.


  **Example:**


  ```python

  def bubble_sort(arr):
      n = len(arr)
      for i in range(n):
          for j in range(0, n-i-1):
              if arr[j] > arr[j+1]:
                  arr[j], arr[j+1] = arr[j+1], arr[j]
      return arr
  ```


  ### 2. Selection Sort


  Selection Sort works by finding the smallest item and moving it to the front.
  You keep doing this until the whole list is sorted.


  **Example:**


  ```python

  def selection_sort(arr):
      n = len(arr)
      for i in range(n):
          min_idx = i
          for j in range(i+1, n):
              if arr[j] < arr[min_idx]:
                  min_idx = j
          arr[i], arr[min_idx] = arr[min_idx], arr[i]
      return arr
  ```


  ### 3. Insertion Sort


  Insertion Sort builds the sorted list one item at a time. It takes each item
  and puts it in the right spot.


  **Example:**


  ```python

  def insertion_sort(arr):
      for i in range(1, len(arr)):
          key = arr[i]
          j = i-1
          while j >= 0 and key < arr[j]:
              arr[j + 1] = arr[j]
              j -= 1
          arr[j + 1] = key
      return arr
  ```


  ### 4. Merge Sort


  Merge Sort splits the list into two parts, sorts them, and then puts them back
  together.


  **Example:**


  ```python

  def merge_sort(arr):
      if len(arr) > 1:
          mid = len(arr) // 2
          L = arr[:mid]
          R = arr[mid:]

          merge_sort(L)
          merge_sort(R)

          i = j = k = 0
          while i < len(L) and j < len(R):
              if L[i] < R[j]:
                  arr[k] = L[i]
                  i += 1
              else:
                  arr[k] = R[j]
                  j += 1
              k += 1

          while i < len(L):
              arr[k] = L[i]
              i += 1
              k += 1

          while j < len(R):
              arr[k] = R[j]
              j += 1
              k += 1
      return arr
  ```


  ### 5. Quick Sort


  Quick Sort picks a 'pivot' and sorts items into those less than and greater
  than the pivot, then sorts those groups.


  **Example:**


  ```python

  def quick_sort(arr):
      if len(arr) <= 1:
          return arr
      else:
          pivot = arr[0]
          less = [x for x in arr[1:] if x <= pivot]
          greater = [x for x in arr[1:] if x > pivot]
          return quick_sort(less) + [pivot] + quick_sort(greater)
  ```


  Each sorting method has its own pros and cons, and choosing one depends on
  what you need, like how fast it works or how much space it uses.
