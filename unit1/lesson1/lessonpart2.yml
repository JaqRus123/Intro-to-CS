id: lessonpart2
title: Introduction to Lists
content: |+
  # Introduction to Lists

  In Python, a ***list*** is a very popular data structure that allows you to store an ordered collection of items. You can think of a list in Python just like you would any list in real life - like a playlist of songs, a grocery list, or a To-Do list.

  > "Lists are how I parse and manage the world." - Adam Savage

  The items that make up a list can be of any data type - like numbers, strings, or even other lists. In this lesson, we will explore how to create, modify, order, and delete items from a list.

  ![0.83](data:image/png;base64, "Shopping list")

  ### Example code:

  ```
  num_list = [1, 2, 3]
  ```

